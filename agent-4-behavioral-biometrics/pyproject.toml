[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent4-behavioral-biometrics"
version = "2.0.0"
description = "Timing-only keystroke behavioural risk scoring for the Procurement Integrity Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# Training, evaluation, reports and figures (not needed to serve a trained model).
train = ["scikit-learn>=1.4", "pandas>=2.1", "matplotlib>=3.8"]
dev = ["scikit-learn>=1.4", "pandas>=2.1", "matplotlib>=3.8", "httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23"]
# The demo website and bot test-bench (python -m demo ...). Not part of the deployable service.
demo = ["httpx>=0.27", "playwright>=1.40", "matplotlib>=3.8"]

[project.scripts]
agent4 = "agent4.cli:main"

[tool.setuptools.packages.find]
include = ["agent4*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
