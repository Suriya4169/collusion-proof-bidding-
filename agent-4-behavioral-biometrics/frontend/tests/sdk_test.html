<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 4 SDK tests</title>
<style>body{font:14px system-ui,sans-serif;margin:16px}pre{white-space:pre-wrap}</style>
</head>
<body>
<h1>Agent 4 collector: self-test</h1>
<p>Open this file in any browser. It runs automatically and prints PASS/FAIL lines below.</p>
<div id="fields" hidden>
  <input id="text1" type="text">
  <input id="pw" type="password">
  <textarea id="area"></textarea>
  <input id="ro" type="text" readonly>
  <div data-agent4-ignore><input id="ignored" type="text"></div>
  <button id="btn">btn</button>
</div>
<pre id="out">running...</pre>
<script src="../biometrics.js"></script>
<script>
(async function () {
  var lines = [], failed = 0, passed = 0;
  function check(name, cond, detail) {
    if (cond) { passed++; lines.push("PASS  " + name); }
    else { failed++; lines.push("FAIL  " + name + (detail ? "  -> " + detail : "")); }
  }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  var clock = 0;
  var now = function () { return clock; };
  var $ = function (id) { return document.getElementById(id); };

  // Dispatch a key event at `time` on `target`. `trap` records any read of key identity.
  function key(type, time, target, init, trap) {
    clock = time;
    var ev = new KeyboardEvent(type, Object.assign({ bubbles: true, cancelable: true }, init || {}));
    if (trap) {
      ["key", "code", "keyCode", "charCode", "which"].forEach(function (p) {
        Object.defineProperty(ev, p, { get: function () { trap.push(p); return undefined; } });
      });
    }
    target.dispatchEvent(ev);
  }
  function focus(time, target) { clock = time; target.dispatchEvent(new FocusEvent("focusin", { bubbles: true })); }
  function type(c, down, up, target, init, trap) { key("keydown", down, target, init, trap); key("keyup", up, target, init, trap); }

  function fresh(extra) {
    var c = Agent4Biometrics.createCollector(Object.assign({ sessionId: "sess-1", now: now, minEvents: 3 }, extra || {}));
    c.start();
    return c;
  }

  // 1. exact timing
  var c = fresh();
  focus(1000, $("text1"));
  type("a", 1500, 1580, $("text1"));
  type("b", 1700, 1790, $("text1"));
  type("c", 1900, 1975, $("text1"));
  var p = c.getPayload();
  check("intervals are onset + release-to-press gaps", same(p.intervals, [500, 120, 110]), JSON.stringify(p.intervals));
  check("holds are key-down to key-up durations", same(p.hold_durations, [80, 90, 75]), JSON.stringify(p.hold_durations));
  check("payload has exactly the three expected fields", same(Object.keys(p), ["session_id", "intervals", "hold_durations"]));
  check("session id is passed through", p.session_id === "sess-1");
  c.stop();

  // 2. privacy: key identity is never read by default
  var trap = [];
  c = fresh();
  focus(0, $("text1"));
  for (var i = 0; i < 6; i++) type("x", 100 + i * 150, 170 + i * 150, $("text1"), { key: "s", code: "KeyS" }, trap);
  check("default mode never reads key/code/keyCode/charCode/which", trap.length === 0, "accessed: " + trap.join(","));
  p = c.getPayload();
  check("payload contains only numbers", p.intervals.concat(p.hold_durations).every(function (v) { return typeof v === "number"; }));
  check("serialised timing arrays contain only digits, dots, commas and brackets",
        /^[\d.,\[\]]+$/.test(JSON.stringify(p.intervals.concat(p.hold_durations))));
  c.stop();

  // 3. rollover: overlapping keys give a clamped (>= 0) gap
  c = fresh();
  focus(0, $("text1"));
  key("keydown", 0, $("text1")); key("keydown", 50, $("text1"));
  key("keyup", 90, $("text1")); key("keyup", 130, $("text1"));
  key("keydown", 400, $("text1")); key("keyup", 470, $("text1"));
  p = c.getPayload();
  check("rollover gap is clamped to 0", p.intervals[1] === 0, JSON.stringify(p.intervals));
  check("all intervals are non-negative", p.intervals.every(function (v) { return v >= 0; }));
  check("all holds are strictly positive", p.hold_durations.every(function (v) { return v > 0; }));
  c.stop();

  // 4. precise pairing (opt-in) pairs overlapping keys by code, in memory only
  c = fresh({ precisePairing: true });
  focus(0, $("text1"));
  key("keydown", 0, $("text1"), { code: "KeyA" }); key("keydown", 50, $("text1"), { code: "KeyB" });
  key("keyup", 90, $("text1"), { code: "KeyB" }); key("keyup", 130, $("text1"), { code: "KeyA" });
  key("keydown", 300, $("text1"), { code: "KeyC" }); key("keyup", 360, $("text1"), { code: "KeyC" });
  p = c.getPayload();
  check("precise pairing gives exact holds for overlapping keys", same(p.hold_durations, [130, 40, 60]), JSON.stringify(p.hold_durations));
  c.stop();

  // 5. ignored fields and events
  c = fresh();
  [$("pw"), $("ro"), $("ignored"), $("btn")].forEach(function (el, k) { focus(10 * k, el); type("z", 100 + 300 * k, 180 + 300 * k, el); });
  check("password, read-only, data-agent4-ignore and non-text targets are ignored", c.count() === 0, "count=" + c.count());
  focus(0, $("area")); type("t", 100, 170, $("area"));
  check("textarea is tracked", c.count() === 1);
  key("keydown", 400, $("text1"), { repeat: true }); key("keyup", 450, $("text1"));
  check("auto-repeat key-downs are ignored", c.count() === 1, "count=" + c.count());
  c.stop();

  // 6. cap
  c = fresh({ maxEvents: 5 });
  focus(0, $("text1"));
  for (i = 0; i < 9; i++) type("k", 100 + i * 120, 160 + i * 120, $("text1"));
  check("keeps at most maxEvents (most recent)", c.count() === 5, "count=" + c.count());
  c.stop();

  // 7. stop() detaches; reset() clears
  c = fresh();
  focus(0, $("text1")); type("a", 100, 160, $("text1"));
  c.stop(); type("b", 300, 360, $("text1"));
  check("stop() detaches the listeners", c.count() === 1, "count=" + c.count());
  c.reset();
  check("reset() clears captured timing", c.count() === 0 && c.getPayload() === null);

  // 8. send(): gating, request shape, error path
  var calls = [];
  var okFetch = function (url, init) { calls.push({ url: url, init: init }); return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve({ status: "scored" }); } }); };
  c = fresh({ endpoint: "/api/behavior/analyze", fetchImpl: okFetch, headers: { "X-API-Key": "k" }, minEvents: 4 });
  focus(0, $("text1")); type("a", 100, 160, $("text1")); type("b", 300, 360, $("text1"));
  var r = await c.send();
  check("send() returns null and sends nothing before minEvents", r === null && calls.length === 0);
  type("c", 500, 560, $("text1")); type("d", 700, 765, $("text1"));
  r = await c.send();
  var body = calls.length ? JSON.parse(calls[0].init.body) : null;
  check("send() POSTs the payload as JSON", calls.length === 1 && calls[0].init.method === "POST" && body && same(Object.keys(body), ["session_id", "intervals", "hold_durations"]));
  check("send() sets content type and forwards custom headers", calls[0].init.headers["Content-Type"] === "application/json" && calls[0].init.headers["X-API-Key"] === "k");
  check("send() resolves to the parsed response", r && r.status === "scored");
  c.stop();

  var badFetch = function () { return Promise.resolve({ ok: false, status: 401, json: function () { return Promise.resolve({ detail: "no" }); } }); };
  c = fresh({ endpoint: "/x", fetchImpl: badFetch, minEvents: 1 });
  focus(0, $("text1")); type("a", 100, 160, $("text1"));
  var err = null;
  try { await c.send(); } catch (e) { err = e; }
  check("send() rejects with the HTTP status on an error response", err && err.status === 401);
  c.stop();

  // 9. input validation of the options
  var threw = false;
  try { Agent4Biometrics.createCollector({}); } catch (e) { threw = true; }
  check("createCollector requires a sessionId", threw);

  var summary = "SUMMARY: " + passed + " passed, " + failed + " failed";
  document.getElementById("out").textContent = lines.join("\n") + "\n" + summary + "\n" + (failed === 0 ? "ALL PASSED" : "SOME FAILED");
})().catch(function (e) {
  document.getElementById("out").textContent = "ERROR: " + (e && e.stack || e) + "\nSOME FAILED";
});
</script>
</body>
</html>
