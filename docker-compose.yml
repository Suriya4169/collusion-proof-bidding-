version: "3.9"

# Configuration comes from a .env file next to this one (copy .env.example). Nothing secret lives in this file.
#
#   Local database:    COMPOSE_PROFILES=local-db   (starts the postgres service below)
#   Supabase database: leave COMPOSE_PROFILES empty and put the Supabase connection string in DATABASE_URL
#                      (docs/SUPABASE_SETUP.md)

services:
  # 1. PostgreSQL for local use. Not started when you use a managed database such as Supabase.
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    container_name: procureguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: procureguard
      POSTGRES_USER: pg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}   # must match the password inside DATABASE_URL
    ports:
      - "127.0.0.1:5432:5432"   # this machine only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg_user -d procureguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - procureguard-network

  # 2. FastAPI Sovereign AI Backend
  backend:
    build:
      context: .            # repo root: the image also needs cartel-graph/, agent-4-behavioral-biometrics/ and solvency-calculator/
      dockerfile: backend/Dockerfile
    container_name: procureguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false      # absent when the local-db profile is off (Supabase)
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (local Postgres or Supabase)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ random characters)}
      M2M_MASTER_KEY: ${M2M_MASTER_KEY:?set M2M_MASTER_KEY in .env}
      PROCUREGUARD_ENV: ${PROCUREGUARD_ENV:-development}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT4_ROOT: /app/agent-4-behavioral-biometrics
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}      # hostnames clients use to reach /mcp/ (default: localhost only)
    ports:
      - "8000:8000"
    volumes:
      - vault_data:/app/backend/test_data/vault_storage
      - upload_data:/app/backend/test_data/uploads
    networks:
      - procureguard-network

  # 3. Next.js 16 Dark-Mode Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: procureguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    networks:
      - procureguard-network

volumes:
  postgres_data:
  vault_data:
  upload_data:

networks:
  procureguard-network:
    driver: bridge
